<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@NOMBRE@@</title>
<style>
  :root { color-scheme: light dark; --fondo: #f4f5f7; --tinta: #16181d; --suave: #5c6370; --borde: #dfe2e8; --tarjeta: #ffffff; --acento: #0b6bcb; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #15171c; --tinta: #eceef2; --suave: #9aa2b1; --borde: #2a2e37; --tarjeta: #1d2027; --acento: #6aa9f0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--fondo); color: var(--tinta);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .tarjeta { width: 100%; max-width: 380px; background: var(--tarjeta); border: 1px solid var(--borde);
             border-radius: 16px; padding: 28px 24px; }
  h1 { margin: 0 0 2px; font-size: 1.5rem; letter-spacing: -0.01em; }
  .puesto { margin: 0; color: var(--acento); font-weight: 600; font-size: 0.95rem; }
  .empresa { margin: 2px 0 20px; color: var(--suave); font-size: 0.9rem; }
  dl { margin: 0 0 24px; display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; font-size: 0.95rem; }
  dt { color: var(--suave); }
  dd { margin: 0; overflow-wrap: anywhere; }
  a { color: inherit; }
  dd a { text-decoration-color: var(--borde); }
  .guardar { display: block; padding: 14px; border-radius: 10px; background: var(--acento); color: #fff;
             text-align: center; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
  <main class="tarjeta">
    <h1>@@NOMBRE@@</h1>
    <p class="puesto">@@PUESTO@@</p>
    <p class="empresa">@@EMPRESA@@</p>
    <dl>
      <dt>Teléfono</dt><dd><a href="tel:@@TEL@@">@@TEL@@</a></dd>
      <dt>Correo</dt><dd><a href="mailto:@@EMAIL@@">@@EMAIL@@</a></dd>
      <dt>Lugar</dt><dd>@@LUGAR@@</dd>
    </dl>
    <a class="guardar" href="c.vcf" download="contacto.vcf">Guardar contacto</a>
  </main>
</body>
</html>
